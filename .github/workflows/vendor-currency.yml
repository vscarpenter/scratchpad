name: Vendor currency

# Fails when a vendored library in public/js/vendor/ falls behind its latest
# npm release. DOMPurify is the only control standing between a shared note and
# the recipient's origin, so a silent drift there matters. Runs weekly rather
# than per-commit because the vendored files change rarely and the check needs
# the npm registry.
#
# The runner image ships Node and npm, so no setup-node step is needed.

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Compare vendored versions against npm
        run: node scripts/check-vendor-versions.mjs
